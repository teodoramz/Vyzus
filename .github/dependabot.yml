version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Every PR here runs the full integration suite (Postgres, Redis, Chromium),
    # so keep the number of PRs low and let grouping do the batching.
    open-pull-requests-limit: 5
    groups:
      # One PR for all routine bumps across the whole workspace.
      minor-and-patch:
        update-types: [minor, patch]
      # Majors still get reviewed, but batched by area rather than one PR each.
      dev-tooling-major:
        patterns: ['eslint*', '@eslint/*', 'typescript-eslint', 'prettier*', 'vitest', 'tsup', 'tsx', '@types/*']
        update-types: [major]
    ignore:
      # playwright must stay in lockstep with the worker.Dockerfile image tag
      # (enforced by the playwright-lockstep CI job) — bump both together.
      - dependency-name: playwright
      # bullmq is pinned to an exact version, not a range. 5.81.3 broke the
      # worker: jobs lost their Redis keys mid-processing ("Missing key for
      # job ... moveToFinished" / "could not renew lock"), failing four e2e
      # pipeline tests. Unpin only with a green `pnpm --filter @vyzus/worker
      # test` on the candidate version.
      - dependency-name: bullmq

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directories:
      - /infra
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      base-images:
        patterns: ['*']
        # Belt and braces: the group is what actually opens the PR, so the
        # exclusion has to apply here too, not only in `ignore` below.
        exclude-patterns: ['*playwright*']
    ignore:
      # The Playwright image tag is pinned to the `playwright` npm version and
      # enforced by the playwright-lockstep CI job. Dependabot's docker
      # ecosystem cannot see that npm pin, so it proposes an image bump on its
      # own — which always fails lockstep. Bump both together by hand instead.
      #
      # Wildcard rather than the full registry path: the first attempt used
      # `mcr.microsoft.com/playwright` and a PR still appeared, so Dependabot is
      # matching on a shorter name than the FROM line shows.
      - dependency-name: '*playwright*'
      # Node majors only. 24 is LTS; 25 is not, and it also unbundled corepack,
      # so `corepack enable` in the Dockerfiles exits 127 on it. Patch and minor
      # bumps of the 24 line still come through.
      - dependency-name: node
        update-types: ['version-update:semver-major']
