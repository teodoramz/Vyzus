name: CI

# Runs where the answer changes a decision: on a pull request, before merging,
# and on demand. Not on every push to main — that re-verified a commit CI had
# already checked as a PR, at the cost of a full Chromium run each time.
# Releases are covered separately: release.yml re-verifies the tagged commit
# from scratch before publishing anything.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Which parts of the tree changed. Expensive jobs below gate on this instead
  # of the workflow using `paths-ignore`: a path-filtered workflow is reported
  # as "expected but never run", which blocks a PR when CI is a required check.
  # This way the workflow always reports, and only the costly jobs are skipped.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            files=$(git diff --name-only "$base"...HEAD)
          else
            # A manual run is an explicit "check everything" — no filtering.
            echo "manual run: forcing every job"
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "docker=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed files:"; echo "$files"

          # Anything that is not purely documentation.
          if echo "$files" | grep -qvE '^(docs/|targets/|.*\.md$|LICENSE$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

          # Image builds only matter when the build inputs move.
          if echo "$files" | grep -qE '^(infra/|apps/|packages/|pnpm-lock\.yaml|pnpm-workspace\.yaml|package\.json)'; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
          else
            echo "docker=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint and format
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: ESLint
        run: pnpm lint
      - name: Prettier
        run: pnpm format:check

  build-test:
    name: Build, typecheck, test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # Mirrors docker-compose.test.yml (host ports 5433/6380 are the suite defaults).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vyzus_test
          POSTGRES_USER: vyzus
          POSTGRES_PASSWORD: vyzus
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U vyzus -d vyzus_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6380:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      VYZUS_TEST_NO_DOCKER: '1' # services above replace docker-compose.test.yml
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version pinned by packageManager in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Keyed on the resolved version in the lockfile, not the declared range,
      # so a transitive bump invalidates the cache instead of silently reusing
      # a browser build that no longer matches the client.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(pnpm --filter @vyzus/worker exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # On a cache hit only the OS packages are missing, and installing those
      # is far cheaper than re-downloading the browser.
      - name: Install Playwright Chromium
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm --filter @vyzus/worker exec playwright install-deps chromium
          else
            pnpm --filter @vyzus/worker exec playwright install --with-deps chromium
          fi

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (integration — real Postgres/Redis/BullMQ/Chromium)
        run: pnpm test

  docker-images:
    name: Docker image build (${{ matrix.image }})
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false # one broken image should not hide the state of the others
      matrix:
        image: [api, worker, dashboard]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.image }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/${{ matrix.image }}.Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  playwright-lockstep:
    name: Playwright version lockstep
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: worker package.json playwright == worker.Dockerfile image tag
        run: |
          pkg_version=$(node -p "require('./apps/worker/package.json').dependencies.playwright")
          # Both stages of the Dockerfile must agree, not just the first.
          mapfile -t img_versions < <(grep -oP 'playwright:v\K[0-9.]+' infra/worker.Dockerfile)
          echo "package.json: $pkg_version — Dockerfile tags: ${img_versions[*]}"
          for v in "${img_versions[@]}"; do
            test "$pkg_version" = "$v" || {
              echo "::error file=infra/worker.Dockerfile::playwright $pkg_version does not match image tag v$v — bump both together"
              exit 1; }
          done

  # Single gate for branch protection: one required check that stays green when
  # the heavy jobs are legitimately skipped, but fails if any of them failed.
  ci-ok:
    name: CI
    if: always()
    needs: [lint, build-test, docker-images, playwright-lockstep]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any required job failed
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "job results: $results"
          for r in $results; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a CI job reported '$r'"; exit 1 ;;
            esac
          done
