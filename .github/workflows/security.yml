name: Security

# Same policy as ci.yml. Push-to-main is included so every commit gets a
# verdict you can actually look at; the weekly schedule stays because it is the
# one that catches a CVE published against a dependency nobody touched.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1' # weekly, Monday 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (JS/TS static analysis)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4

  dependency-audit:
    name: Dependency vulnerability audit (pnpm)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      # Deliberately no `cache: pnpm` here: this job reads the lockfile and
      # never installs, so there is no pnpm store on disk. setup-node's
      # post-job cache-save then fails with "Path(s) specified in the action
      # for caching do(es) not exist", failing a job whose audit had passed.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Fails on known vulnerabilities of high/critical severity anywhere in the
      # lockfile. Moderate findings are reported in the log but don't block.
      #
      # Acknowledged exceptions live in `pnpm.auditConfig.ignoreGhsas` (root
      # package.json) so the gate itself is never weakened. Currently one:
      #   GHSA-qwww-vcr4-c8h2 — react-router RSC-mode CSRF. The advisory states
      #   it only affects applications using the unstable RSC APIs; the
      #   dashboard is a client-only SPA (BrowserRouter/Routes/Link). The fix
      #   lands in react-router 8.3.0, and `react-router-dom` — what the
      #   dashboard actually depends on — has no 8.x release, so there is no
      #   upgrade path to take. Revisit when react-router-dom 8 ships.
      - name: pnpm audit (report all)
        run: pnpm audit || true
      - name: pnpm audit (gate on high+)
        run: pnpm audit --audit-level high

  dependency-review:
    name: Dependency review (PR diff)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan full history
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image-scan:
    name: Image scan (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # All three, not just the api: the worker ships Chromium and the full
        # Playwright base image, which is by far the largest CVE surface here,
        # and the dashboard ships an nginx runtime of its own.
        image: [api, worker, dashboard]
    steps:
      - uses: actions/checkout@v7
      - name: Build ${{ matrix.image }} image
        run: docker build -f infra/${{ matrix.image }}.Dockerfile -t vyzus-${{ matrix.image }}:scan .
      - name: Trivy scan (OS packages + bundled node deps)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: vyzus-${{ matrix.image }}:scan
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@v4
        # Dependabot-triggered runs get a read-only GITHUB_TOKEN regardless of
        # the `permissions:` above, so uploading to code scanning is refused
        # ("Resource not accessible by integration") and fails the job. The scan
        # itself still runs on those PRs — only the upload is skipped.
        if: always() && github.actor != 'dependabot[bot]'
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}

  # Catches vulnerable dependencies and risky IaC/Dockerfile settings in the
  # source tree itself, which an image scan cannot see (it only sees the built
  # result, not e.g. a Dockerfile that would run as root).
  repo-scan:
    name: Repository scan (Trivy fs + config)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Trivy filesystem + misconfiguration scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          format: sarif
          output: trivy-repo.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@v4
        # Dependabot-triggered runs get a read-only GITHUB_TOKEN regardless of
        # the `permissions:` above, so uploading to code scanning is refused
        # ("Resource not accessible by integration") and fails the job. The scan
        # itself still runs on those PRs — only the upload is skipped.
        if: always() && github.actor != 'dependabot[bot]'
        with:
          sarif_file: trivy-repo.sarif
          category: trivy-repo
