server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite content-hashes every filename under /assets/, so a changed file is
    # always a new URL — safe to cache indefinitely. index.html references
    # those hashed filenames, so it must NEVER be cached, or a browser tab/
    # reload can keep referencing assets from a previous deploy indefinitely
    # (no Cache-Control here at all meant browsers applied their own
    # heuristic caching — the actual cause of "I redeployed but nothing
    # changed" reports).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    # REST API
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 2m;          # journey spec uploads
        proxy_read_timeout 120s;          # dry-run can take up to check timeout
    }

    # WebSocket
    location /ws {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }
}
