# Everything a Vyzus server block serves. Included by both the plain-HTTP
# config (infra/nginx.conf) and the TLS one (infra/nginx-tls.conf) so the two
# can never drift apart. Included *inside* a server block, which is why it
# lives outside conf.d/ — nginx would otherwise load it as a top-level config
# and refuse to start on the bare `location` directives.

root /usr/share/nginx/html;
index index.html;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;

# $vyzus_hsts is empty on plain HTTP connections (conf.d/00-hsts.conf maps it
# from $ssl_protocol) and nginx omits an add_header whose value is empty, so
# the same line is a no-op over HTTP and a real HSTS header over TLS. It is
# repeated per location on purpose: add_header does not inherit into a block
# that declares its own, and every location below declares one.
add_header Strict-Transport-Security $vyzus_hsts always;

# Vite content-hashes every filename under /assets/, so a changed file is
# always a new URL — safe to cache indefinitely. index.html references
# those hashed filenames, so it must NEVER be cached, or a browser tab/
# reload can keep referencing assets from a previous deploy indefinitely
# (no Cache-Control here at all meant browsers applied their own
# heuristic caching — the actual cause of "I redeployed but nothing
# changed" reports).
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Strict-Transport-Security $vyzus_hsts always;
}

location = /index.html {
    add_header Cache-Control "no-cache";
    add_header Strict-Transport-Security $vyzus_hsts always;
}

# SPA fallback
location / {
    add_header Cache-Control "no-cache";
    add_header Strict-Transport-Security $vyzus_hsts always;
    try_files $uri /index.html;
}

# REST API
location /api/ {
    add_header Strict-Transport-Security $vyzus_hsts always;
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 2m;          # journey spec uploads
    proxy_read_timeout 120s;          # dry-run can take up to check timeout
}

# WebSocket
location /ws {
    add_header Strict-Transport-Security $vyzus_hsts always;
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
}
