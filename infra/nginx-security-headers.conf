# Response headers applied to every location. Included per-location rather than
# set once at server level: nginx's add_header does not inherit into a block
# that declares any add_header of its own, and each location here sets HSTS.

# The dashboard loads no third-party anything, so the policy can be strict.
#   script-src 'self'  — possible because the Vite build emits no inline script
#                        (see apps/dashboard/vite.config.ts modulePreload).
#   style-src  unsafe-inline — Recharts and Monaco write element style
#                        attributes; inline style is not an script-execution
#                        vector, so this is the cheap half of the tradeoff.
#   worker-src blob:   — Monaco starts its language services as workers.
#   connect-src 'self' — covers both the REST calls and the /ws upgrade.
#   frame-ancestors    — nothing may frame the dashboard (clickjacking).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# Stops a browser from second-guessing a Content-Type — the API streams
# artifacts whose bytes originate from the monitored site, not from us.
add_header X-Content-Type-Options "nosniff" always;

# frame-ancestors above is the modern equivalent; this covers older browsers.
add_header X-Frame-Options "DENY" always;

# Dashboard URLs carry app and run ids; there is no reason to hand them to
# anywhere else.
add_header Referrer-Policy "no-referrer" always;

# None of these are used, and a monitoring dashboard has no business asking.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
