# Response headers for every location. Included per-location rather than set
# once at server level: nginx's add_header does not inherit into a block that
# declares any add_header of its own, and each location here sets HSTS.

# The dashboard loads no third-party assets, so the policy can be strict.
#   script-src 'self'  — the Vite build emits no inline script; the pre-paint
#                        theme script lives in public/theme-init.js for this.
#   style-src unsafe-inline — Recharts and Monaco write style attributes.
#   worker-src blob:   — Monaco starts its language services as workers.
#   connect-src 'self' — covers the REST calls and the /ws upgrade.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# The API streams artifacts whose bytes come from the monitored site.
add_header X-Content-Type-Options "nosniff" always;

# frame-ancestors above covers modern browsers; this covers the rest.
add_header X-Frame-Options "DENY" always;

# Dashboard URLs carry app and run ids.
add_header Referrer-Policy "no-referrer" always;

add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
