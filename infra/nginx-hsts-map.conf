# Loaded in http context for every deployment, TLS or not. $ssl_protocol is
# empty on a plain-HTTP connection, so $vyzus_hsts is empty there and the
# add_header lines in nginx-common.conf emit nothing. Sending HSTS over HTTP
# would be ignored by browsers anyway; sending it only over TLS is correct.
map $ssl_protocol $vyzus_hsts {
    ""      "";
    default "max-age=31536000; includeSubDomains";
}
