# TLS server. Activated by docker-compose.tls.yml, which mounts this file over
# /etc/nginx/conf.d/default.conf and mounts infra/certs read-only.
#
# Expects, inside the container:
#   /etc/nginx/certs/fullchain.pem   certificate + intermediates
#   /etc/nginx/certs/privkey.pem     private key

# Port 80 exists only to send browsers to HTTPS. If HTTPS_PORT is not 443,
# change $host below to $host:<port> — the redirect cannot know the published
# port on its own.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # TLS 1.2 is the floor; 1.0/1.1 are not offered at all. Cipher order is
    # left to the client, which is the modern recommendation — clients know
    # better than we do whether they have AES hardware.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    ssl_session_cache shared:VyzusTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/vyzus-common.conf;
}
